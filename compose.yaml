services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Demo authentication is not suitable for an internet-facing service.
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      DATABASE_URL: file:/data/interim.db
    volumes:
      - interim-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  interim-data:
